apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-redteam-backend
  labels:
    app: ai-redteam
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-redteam
      tier: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ai-redteam
        tier: backend
    spec:
      containers:
      - name: api
        image: ${ECR_REPOSITORY_URI}/ai-redteam-backend:latest
        imagePullPolicy: Always
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: ai-redteam-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: ai-redteam-secrets
              key: redis-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: ai-redteam-secrets
              key: jwt-secret
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-redteam-secrets
              key: openai-api-key
        - name: ENVIRONMENT
          value: "production"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-redteam-frontend
  labels:
    app: ai-redteam
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-redteam
      tier: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ai-redteam
        tier: frontend
    spec:
      containers:
      - name: web
        image: ${ECR_REPOSITORY_URI}/ai-redteam-frontend:latest
        imagePullPolicy: Always
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "200m"
            memory: "256Mi"
        ports:
        - containerPort: 80
        env:
        - name: REACT_APP_API_URL
          value: "https://api.ai-redteam.example.com"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-redteam-postgres
  labels:
    app: ai-redteam
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-redteam
      tier: database
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: ai-redteam
        tier: database
    spec:
      containers:
      - name: postgres
        image: postgres:13
        resources:
          limits:
            cpu: "1"
            memory: "2Gi"
          requests:
            cpu: "500m"
            memory: "1Gi"
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: ai-redteam-secrets
              key: postgres-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ai-redteam-secrets
              key: postgres-password
        - name: POSTGRES_DB
          value: "ai_redteam"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres"]
          initialDelaySeconds: 30
          periodSeconds: 30
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-redteam-redis
  labels:
    app: ai-redteam
    tier: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-redteam
      tier: cache
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: ai-redteam
        tier: cache
    spec:
      containers:
      - name: redis
        image: redis:6
        resources:
          limits:
            cpu: "500m"
            memory: "1Gi"
          requests:
            cpu: "200m"
            memory: "512Mi"
        ports:
        - containerPort: 6379
        volumeMounts:
        - name: redis-data
          mountPath: /data
        livenessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 30
          periodSeconds: 30
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-pvc 